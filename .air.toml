[build]
include_ext = ["go", "tpl", "tmpl", "templ", "html", "css",]
exclude_regex = ["\\.gen\\.go$", "_gen\\.go$", "_templ\\.go$", "_gen\\.css$", "z_\\.*"]
cmd = "go generate server/components/components.go && go build -o ./tmp/main ./main.go"
bin =  "./tmp/main"
# The server will not start without a MODE, and .env.dev is only read once it is development
args_bin = ["-MODE=development"]

