version: '3.8'

services:
  minio:
    image: chainguard/minio:latest
    user: "0"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - "MINIO_ROOT_USER=minioadmin"
      - "MINIO_ROOT_PASSWORD=minioadmin"
    # In memory, so every restart starts with an empty bucket and the server restores nothing old
    tmpfs:
      - /data

  createbuckets:
    image: chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do sleep 1; done; /usr/bin/mc rb --force myminio/mybucket; /usr/bin/mc mb myminio/mybucket"

