version: '3.8'

services:
  minio:
    image: chainguard/minio:latest
    user: "0"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - "MINIO_ROOT_USER=minioadmin"
      - "MINIO_ROOT_PASSWORD=minioadmin"
    volumes:
      - minio-data:/data

  createbuckets:
    image: chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "sleep 2; /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc rb --force myminio/mybucket; /usr/bin/mc mb myminio/mybucket"


volumes:
  minio-data:
