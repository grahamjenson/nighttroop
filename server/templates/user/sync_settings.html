{{ define "content" }}
<div class="card p-4 shadow-sm">
    <h3 class="border-bottom pb-2">Sync Settings</h3>
    <p class="text-muted">Configure how NightTroop syncs with external services.</p>

    <!-- Form updates the status feedback inside the card or pushes an OOB Toast -->
    <form hx-post="/sync-settings" hx-target="#form-feedback" class="mt-4">
        <div id="form-feedback"></div>

        <!-- NIGHTSCOUT SECTION -->
        <div class="card p-3 mb-4 bg-light border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Nightscout Sync</h5>
                <div class="form-check form-switch">
                    <!-- Controlled via simple toggle visibility script -->
                    <input class="form-check-input" type="checkbox" name="ns_enabled" id="nightscoutSync" checked
                        onchange="document.getElementById('ns-fields').classList.toggle('d-none', !this.checked)">
                    <label class="form-check-label" for="nightscoutSync">Enable</label>
                </div>
            </div>

            <div id="ns-fields" class="row g-3">
                <div class="col-md-7">
                    <label for="nsUrl" class="form-label">Nightscout URL</label>
                    <!-- Pattern prevents trailing slashes or subpaths (e.g. rejects domain.com) -->
                    <input type="url" class="form-control" id="nsUrl" name="ns_url"
                        placeholder="https://your-nightscout.herokuapp.com" pattern="https?://[^/]+"
                        title="URL must not contain a sub-path or trailing slash (e.g., https://example.com)" required>
                    <div class="form-text">Base URL only. No trailing slash or paths.</div>
                </div>
                <div class="col-md-5">
                    <label for="nsPassword" class="form-label">API Secret / Password</label>
                    <input type="password" class="form-control" id="nsPassword" name="ns_password" required>
                </div>
            </div>
        </div>

        <!-- DEXCOM SECTION -->
        <div class="card p-3 mb-4 bg-light border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Dexcom Share Sync</h5>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="dex_enabled" id="dexcomSync"
                        onchange="document.getElementById('dex-fields').classList.toggle('d-none', !this.checked)">
                    <label class="form-check-label" for="dexcomSync">Enable</label>
                </div>
            </div>

            <!-- Initially hidden because checkbox is unchecked -->
            <div id="dex-fields" class="row g-3 d-none">
                <div class="col-md-5">
                    <label for="dexUsername" class="form-label">Dexcom Username</label>
                    <input type="text" class="form-control" id="dexUsername" name="dex_username">
                </div>
                <div class="col-md-4">
                    <label for="dexPassword" class="form-label">Dexcom Password</label>
                    <input type="password" class="form-control" id="dexPassword" name="dex_password">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="w-100 p-2 bg-white border rounded d-flex justify-content-around align-items-center"
                        style="height: 38px;">
                        <span class="small text-muted me-1">Server Region:</span>
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="radio" name="dex_region" id="regionUS" value="US"
                                checked>
                            <label class="form-check-label small" for="regionUS">USA</label>
                        </div>
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="radio" name="dex_region" id="regionINT" value="INT">
                            <label class="form-check-label small" for="regionINT">Outside USA</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <button type="submit" class="btn btn-primary px-4">Save Settings</button>
        </div>
    </form>
</div>
{{ end }}
