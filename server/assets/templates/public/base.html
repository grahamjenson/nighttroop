<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Better Browser Title -->
    <title>Nighttroopz • Secure Instance Manager</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo.png">


    <!-- Bootstrap -->
    <link href="bootstrap.css" rel="stylesheet">
    <script src="htmx.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #e0e1dd;
        }

        .center-container {
            min-height: 100vh;
        }

        .nighttroopz-panel {
            width: 500px;
            min-height: 500px;
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 1rem;
        }

        .panel-content {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-create {
            font-size: 1.5rem;
            padding: 0.9rem 2.2rem;
        }

        .app-title {
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #cbd5e1;
        }

        .brand-header {
            gap: 12px;
            /* space between icon and text */
        }

        .brand-logo {
            width: 120px;
            height: 120px;
            margin-right: 12px;
            border-radius: 8px;
            /* subtle rounding */

        }

        .app-title {
            font-family: Tahoma, sans-serif;
            /* modern tech-style font */
            font-weight: 700;
            font-size: 1.8rem;
            color: #b5b3f5;
            /* dark but soft color */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            /* subtle depth */
        }

        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: block;
        }

        .htmx-request #create-user-btn {
            display: none;
        }
    </style>

    <script>
        (function () {
            /** @type {import("../htmx").HtmxInternalApi} */
            var api

            var attrPrefix = 'hx-target-'

            // IE11 doesn't support string.startsWith
            function startsWith(str, prefix) {
                return str.substring(0, prefix.length) === prefix
            }

            /**
               * @param {HTMLElement} elt
               * @param {number} respCode
               * @returns {HTMLElement | null}
               */
            function getRespCodeTarget(elt, respCodeNumber) {
                if (!elt || !respCodeNumber) return null

                var respCode = respCodeNumber.toString()

                // '*' is the original syntax, as the obvious character for a wildcard.
                // The 'x' alternative was added for maximum compatibility with HTML
                // templating engines, due to ambiguity around which characters are
                // supported in HTML attributes.
                //
                // Start with the most specific possible attribute and generalize from
                // there.
                var attrPossibilities = [
                    respCode,

                    respCode.substring(0, 2) + '*',
                    respCode.substring(0, 2) + 'x',

                    respCode.substring(0, 1) + '*',
                    respCode.substring(0, 1) + 'x',
                    respCode.substring(0, 1) + '**',
                    respCode.substring(0, 1) + 'xx',

                    '*',
                    'x',
                    '***',
                    'xxx'
                ]
                if (startsWith(respCode, '4') || startsWith(respCode, '5')) {
                    attrPossibilities.push('error')
                }

                for (var i = 0; i < attrPossibilities.length; i++) {
                    var attr = attrPrefix + attrPossibilities[i]
                    var attrValue = api.getClosestAttributeValue(elt, attr)
                    if (attrValue) {
                        if (attrValue === 'this') {
                            return api.findThisElement(elt, attr)
                        } else {
                            return api.querySelectorExt(elt, attrValue)
                        }
                    }
                }

                return null
            }

            /** @param {Event} evt */
            function handleErrorFlag(evt) {
                if (evt.detail.isError) {
                    if (htmx.config.responseTargetUnsetsError) {
                        evt.detail.isError = false
                    }
                } else if (htmx.config.responseTargetSetsError) {
                    evt.detail.isError = true
                }
            }

            htmx.defineExtension('response-targets', {

                /** @param {import("../htmx").HtmxInternalApi} apiRef */
                init: function (apiRef) {
                    api = apiRef

                    if (htmx.config.responseTargetUnsetsError === undefined) {
                        htmx.config.responseTargetUnsetsError = true
                    }
                    if (htmx.config.responseTargetSetsError === undefined) {
                        htmx.config.responseTargetSetsError = false
                    }
                    if (htmx.config.responseTargetPrefersExisting === undefined) {
                        htmx.config.responseTargetPrefersExisting = false
                    }
                    if (htmx.config.responseTargetPrefersRetargetHeader === undefined) {
                        htmx.config.responseTargetPrefersRetargetHeader = true
                    }
                },

                /**
                     * @param {string} name
                     * @param {Event} evt
                     */
                onEvent: function (name, evt) {
                    if (name === 'htmx:beforeSwap' &&
                        evt.detail.xhr &&
                        evt.detail.xhr.status !== 200) {
                        if (evt.detail.target) {
                            if (htmx.config.responseTargetPrefersExisting) {
                                evt.detail.shouldSwap = true
                                handleErrorFlag(evt)
                                return true
                            }
                            if (htmx.config.responseTargetPrefersRetargetHeader &&
                                evt.detail.xhr.getAllResponseHeaders().match(/HX-Retarget:/i)) {
                                evt.detail.shouldSwap = true
                                handleErrorFlag(evt)
                                return true
                            }
                        }
                        if (!evt.detail.requestConfig) {
                            return true
                        }
                        var target = getRespCodeTarget(evt.detail.requestConfig.elt, evt.detail.xhr.status)
                        if (target) {
                            handleErrorFlag(evt)
                            evt.detail.shouldSwap = true
                            evt.detail.target = target
                        }
                        return true
                    }
                }
            })
        })()
    </script>
</head>

<body hx-ext="response-targets">

    {{ block "header" . }}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-uppercase" href="/">Nighttroop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light btn-sm ms-lg-2" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {{ end }}

    <div class="container center-container d-flex align-items-center justify-content-center">
        {{ block "content" . }}{{ end }}
    </div>


    {{ block "footer" . }}
    <footer class="mt-auto py-4 bg-light border-top">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start">
                    <span class="text-muted fw-bold">© 2024 Nighttroop Application</span>
                </div>
                <div class="col-md-4 text-center my-3 my-md-0">
                    <ul class="list-inline mb-0">
                        <li class="list-inline-item"><a href="#" class="text-muted text-decoration-none">Privacy</a>
                        </li>
                        <li class="list-inline-item mx-3"><a href="#" class="text-muted text-decoration-none">Terms</a>
                        </li>
                        <li class="list-inline-item"><a href="#" class="text-muted text-decoration-none">Support</a>
                        </li>
                    </ul>
                </div>
                <div class="col-md-4 text-center text-md-end">
                    <a href="#" class="text-muted me-3"><i class="bi bi-github"></i></a>
                    <a href="#" class="text-muted"><i class="bi bi-twitter"></i></a>
                </div>
            </div>
        </div>
    </footer>
    {{ end }}


</body>

</html>
