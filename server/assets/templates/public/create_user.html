{{ define "content" }}
<div class="nighttroopz-panel shadow-lg p-4 d-flex flex-column">

    <div class="brand-header d-flex align-items-center justify-content-center mb-4">
        <img src="/logo.png" alt="Nighttroopz Icon" class="brand-logo">
        <h2 class="app-title m-0">NightTroopz</h2>
    </div>

    <div id="panel-content" class="panel-content text-center flex-grow-1">
        <div>

            <button id="create-user-btn" class="btn btn-primary btn-create" hx-post="/user" hx-target="#panel-content"
                hx-swap="innerHTML" hx-indicator="#loading" hx-on::before-swap="
                    const status = event.detail.xhr.status;
                    if (status < 200 || status >= 300) { 
                        event.detail.shouldSwap = false; 
                        document.getElementById('error-container').innerHTML = event.detail.xhr.responseText || 'An unexpected error occurred.';
                    } else {
                        document.getElementById('error-container').innerHTML = ''; // Clear previous errors on success
                    }
                ">
                Create User
            </button>

            <div id="loading" class="htmx-indicator mt-3">
                <div class="spinner-border text-light"></div>
                <div class="text-secondary mt-2">Creating User...</div>
            </div>

            <!-- Global error spot for this panel -->
            <div id="error-container" class="mt-3"></div>
        </div>
    </div>

    <div class="text-center text-secondary small mt-3">
        Secure • Private • Open Source
    </div>
</div>
{{ end }}
