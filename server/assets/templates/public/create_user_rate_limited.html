{{/*PARAM seconds string */}}
{{ define "content" }}
<div id="rate-limit-alert" class="alert alert-warning border-0 shadow-sm mt-3" role="alert">
    <div class=" d-flex align-items-center justify-content-center">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        <span>
            Too many requests. Please wait
            <strong id="countdownNum" class="text-danger">{{ .seconds }}</strong>
            seconds.
        </span>
    </div>
</div>

<script>
    document.span = document.getElementById('countdownNum');

    clearInterval(document._timer);

    document._timer = setInterval(() => {
        let count = parseInt(document.span.innerText);
        if (count <= 1) {
            clearInterval(document._timer);
            document.getElementById('rate-limit-alert').remove();
        } else {
            document.span.innerText = count - 1;
        }
    }, 1000);
</script>
{{ end }}
