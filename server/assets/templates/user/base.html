<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Better Browser Title -->
    <title>Nighttroop for {{.Subdomain}}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo.png">


    <!-- Bootstrap -->
    <link href="bootstrap.css" rel="stylesheet">

    <script src="popper.min.js"></script>
    <script src="bootstrap.min.js"></script>

    <script src="d3.js"></script>

    <script src="htmx.js"></script>
    <script src="htmx_response_targets.js"></script>
</head>

<body hx-ext="response-targets">

    {{ block "header" . }}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-uppercase fw-bold" href="/">Nighttroop</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center">
                    <!-- Dashboard Icon -->
                    <li class="nav-item">
                        <a class="nav-link active me-lg-3" href="#" aria-label="Dashboard">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-house-door-fill" viewBox="0 0 16 16">
                                <path
                                    d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5" />
                            </svg>
                        </a>
                    </li>

                    <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Devices</a></li>

                    <!-- Profile Icon Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="profileDropdown"
                            role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <!-- Generic Person Icon (SVG) -->
                            <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center"
                                style="width: 35px; height: 35px;">
                                <svg xmlns="http://w3.org" width="20" height="20" fill="white" class="bi bi-person-fill"
                                    viewBox="0 0 16 16">
                                    <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
                                </svg>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow"
                            aria-labelledby="profileDropdown">
                            <li>
                                <h6 class="dropdown-header">Account Settings</h6>
                            </li>
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Security</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form method="POST" action="/logout" class="px-3 py-1">
                                    <button type="submit"
                                        class="btn btn-danger btn-sm w-100 text-center">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {{ end }}

    <div class="container center-container d-flex align-items-center justify-content-center">
        {{ block "content" . }}{{ end }}
    </div>


    {{ block "footer" . }}{{ end }}


</body>

</html>
