{{ define "content" }}
<div class="card p-4">
    <h3>Sync Settings</h3>
    <p class="text-muted">Configure how NightTroop syncs with external services.</p>

    <div class="mt-4">
        <h5>Nightscout Sync</h5>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="nightscoutSync" checked>
            <label class="form-check-label" for="nightscoutSync">Enable Nightscout Sync</label>
        </div>
        <div class="mt-2 ms-4">
            <label for="nsUrl" class="form-label">Nightscout URL</label>
            <input type="url" class="form-control" id="nsUrl" placeholder="https://your-nightscout.herokuapp.com">
        </div>
    </div>

    <div class="mt-4">
        <h5>Other Services</h5>
        <p class="text-muted">More sync options coming soon...</p>
    </div>

    <button class="btn btn-primary mt-4">Save Settings</button>
</div>
{{ end }}
