{{ define "header" }}
<!-- This page will have a simpler header than the default -->
<div class="p-3 text-center border-bottom bg-light">
    <h3 class="m-0">Nighttroop Secure Login</h3>
</div>
{{ end }}

{{ define "content" }}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">

            <!-- Form updated with POST method -->
            <form action="/login" method="POST" class="needs-validation">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Welcome Back</h2>
                    <p class="text-muted small">Please enter your details</p>
                </div>

                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Name</label>
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="e.g. jdoe" required
                        autofocus>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••"
                        required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                    Log In
                </button>
            </form>

        </div>
    </div>
</div>

{{ end }}
