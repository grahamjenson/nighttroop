<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Better Browser Title -->
    <title>Control Nighttroop</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo.png">


    <!-- Bootstrap -->
    <link href="bootstrap.css" rel="stylesheet">
    <script src="htmx.js"></script>
    <script src="htmx_response_targets.js"></script>

</head>

<body hx-ext="response-targets">

    {{ block "header" . }}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-uppercase" href="/">Nighttroop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light btn-sm ms-lg-2" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {{ end }}

    <div class="container center-container d-flex align-items-center justify-content-center">
        {{ block "content" . }}{{ end }}
    </div>


    {{ block "footer" . }}
    {{ end }}


</body>

</html>
