name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false

      # Only the downloaded module zips: a few hundred files restore far faster than the
      # unpacked modules, and Go unpacks the ones it needs in seconds.
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod/cache/download
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gomod-${{ runner.os }}-

      # Restores main's last build cache; only pushes to main save one (see the end).
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.sha }}
          restore-keys: gobuild-${{ runner.os }}-

      # Keyed on Go too: generators built with an older Go cannot load packages needing a newer one
      - name: Cache code generator binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-templ0.3.1020-goverter1.10.0-sqlc1.31.1-tailwind4.3.0

      - name: Install code generators
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/jmattheis/goverter/cmd/goverter@v1.10.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          curl -sSL -o ~/go/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64
          chmod +x ~/go/bin/tailwindcss

      - name: Check generated code is up to date
        run: |
          go generate ./...
          git add -N .
          git diff --exit-code || { echo "::error::go generate ./... changed files; run it and commit"; exit 1; }

      - name: Cache playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v0.6201.1

      - name: Install playwright browser
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps chromium

      # -count=1 so integration tests always run instead of replaying cached results.
      # The browser suite in it saves its SCREENSHOT steps to .test/savedScreenshots.
      - name: Test
        run: go test -count=1 ./...

      # Replaces tests/screenshots with the ones the tests just took. Differences from
      # the committed files are reported as a warning, never a failure.
      - name: Collect screenshots
        if: always()
        run: |
          rm -rf tests/screenshots
          mkdir -p tests/screenshots
          cp -R .test/savedScreenshots/. tests/screenshots/ || true
          git add -N tests/screenshots
          git diff --quiet -- tests/screenshots || echo "::warning::screenshots differ from the committed ones; see the screenshots artifact"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots

      # Go refreshes the mtime of an entry it uses that is over an hour old, so entries
      # older than 90 minutes went unused by this run. Dropping them stops the cache growing.
      - name: Trim Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -type f -mmin +90 -delete

      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.sha }}
