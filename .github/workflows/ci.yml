name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Saved on every run (key includes the commit) so the build cache stays fresh.
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Cache code generator binaries
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-templ0.3.1020-goverter1.10.0-sqlc1.31.1-tailwind4.3.0

      - name: Install code generators
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/jmattheis/goverter/cmd/goverter@v1.10.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          curl -sSL -o ~/go/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64
          chmod +x ~/go/bin/tailwindcss

      - name: Generate code
        run: go generate ./...

      # Runs the browser suite in the same container the script uses locally,
      # so the screenshots it makes should match the committed golden files.
      - name: Generate screenshots
        run: ./scripts/screenshots/generateScreenshots.sh

      - name: Check generated code and screenshots are committed
        run: |
          git add -N .
          git diff --exit-code --stat || { echo "::error::generated files differ; run go generate ./... and scripts/screenshots/generateScreenshots.sh then commit"; exit 1; }

      - name: Upload generated screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots

      - name: Start minio
        run: docker compose up -d

      - name: Cache playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v0.6201.1

      - name: Install playwright browser
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps chromium

      # -count=1 so integration tests always run instead of replaying cached results.
      - name: Test
        run: go test -count=1 ./...
