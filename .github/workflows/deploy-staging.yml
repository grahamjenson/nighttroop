name: Deploy staging

# Deploys each push to main to the staging Nighttroop on Fly.io, without waiting for CI: what reaches main passed CI on
# its pull request, and a commit that does not build fails to deploy, leaving the last one running. Staging keeps its
# data between deploys unless a migration change means a database can no longer be migrated; see
# docs/deploy/staging_flyio/README.md. It does nothing until the repository variable STAGING_FLYIO_APP names the Fly
# app and the secret FLY_API_TOKEN holds a deploy token for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.STAGING_FLYIO_APP != ''
    # One deploy at a time: one running is left to finish, and the pushes meanwhile wait as a single run, each newer one
    # replacing the one waiting, so they are deployed together, as the newest of them, once it is done. On the job, so a
    # run that skips it never takes the place of one waiting. A run waiting uses no Actions minutes.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # From the repository's root, the build context, with the staging config. One machine, as each has its own data.
      - run: >-
          flyctl deploy . --app "$STAGING_FLYIO_APP" --config docs/deploy/staging_flyio/fly.toml --dockerfile Dockerfile
          --build-target staging --remote-only --ha=false --env DEPLOYMENT="$STAGING_FLYIO_APP"
        env:
          STAGING_FLYIO_APP: ${{ vars.STAGING_FLYIO_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
