version: "2"
sql:
  - schema: "schema.sql"
    queries: "queries.sql"
    engine: "sqlite"
    gen:
      go:
        package: "user"
        out: "."

        emit_prepared_queries: true
        emit_pointers_for_null_types: true

        query_parameter_limit: 3
        
        output_files_suffix: ".gen"
        output_db_file_name: "z_db.go"
        output_models_file_name: "z_models.go"
        output_querier_file_name: "z_querier.go"
        output_batch_file_name: "z_batch.go"
        output_copyfrom_file_name: "z_copyfrom.go"

overrides:
  go:
    rename:
      bolu: Bolus

  