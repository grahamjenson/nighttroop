version: "2"
sql:
  - schema: "schema.sql"
    queries: "./queries"
    engine: "sqlite"
    gen:
      go:
        package: "user"
        out: "."

        emit_prepared_queries: true
        emit_pointers_for_null_types: true

        query_parameter_limit: 3
        
        output_files_suffix: ".gen"
        output_db_file_name: "z_db.go"
        output_models_file_name: "z_models.go"
        output_querier_file_name: "z_querier.go"
        output_batch_file_name: "z_batch.go"
        output_copyfrom_file_name: "z_copyfrom.go"


          
overrides:
  go:
    rename:
      bolu: Bolus
    overrides:
      - column: "sync_sources.dexcom_region"
        go_type:
          import: "nighttroop.t1d.nz/utils/consts"
          type: "DexcomRegion"
      - column: "sync_sources.type"
        go_type:
          import: "nighttroop.t1d.nz/utils/consts"
          type: "SyncSourceType"
      - column: "sync_sources.enabled"
        go_type:
          type: "bool"
      - column: "devices.role"
        go_type:
          import: "nighttroop.t1d.nz/utils/consts"
          type: "DeviceRole"