# English text of the site's reports and summary, by where it is shown. Edit the wording here; the code only has the ids.
site:
  reports:
    # The kinds of period a report can be of, and the tables of a month's summaries of each
    periods:
      day: "Day"
      week: "Week"
      fortnight: "Fortnight"
      month: "Month"
      days: "Days"
      weeks: "Weeks"
      fortnights: "Fortnights"
      months_of: "Months of {{.Year}}"
    # The arrows either side of a report's dates, to the period before and after
    nav:
      previous: "Previous {{.Unit}}"
      next: "Next {{.Unit}}"
    out_of_date: "This report's data changed, so it is being updated. Refresh in a minute or two."
    # Numbers more than one report shows
    metrics:
      average_glucose: "Average glucose"
      coefficient_of_variation: "Coefficient of variation"
      time_in_range: "Time in range"
      days_with_data: "Days with data"
      time_cgm_active: "Time CGM active"
      daily_dose: "Daily dose"
      daily_carbs: "Daily carbs"
    # How a number rose or fell from the report before, as ▲ 0.3 mmol/L on the previous 7 days
    change:
      none: "No change"
      from_previous: "{{.Change}} on {{.Previous}}"
      previous_days: "the previous {{.Days}} days"
      day_before: "the day before"
      previous_month: "the previous month"
