          step_1: "Open *Settings*, then *Nightscout*, and set *URL* to {url}"
          step_2: "Set *Token*, or *API_SECRET* instead, to {token}"
          step_3: "Keep it the *Master* to upload, as a PWD Phone or Read+Write device, or make it a *Follower* of Nightscout to only read."
        nightguard:
          step_1: "Open *Configuration*, and set *URL* to {nightguard}"
        sugarpixel:
          step_1: "In the SugarPixel app, choose *Nightscout* as its glucose source."
          step_2: "Set *Nightscout URL* to {url}"
          step_3: "Set its *token* to {token}"
