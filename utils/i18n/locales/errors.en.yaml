  as_written: "{{.Text}}"
  missing_field:
    name: "Missing required field name"
    group_type: "Missing required field group_type"
    carbs: "Missing required field carbs"
    token: "Missing required field token"
    connector_type: "Missing required field id/type"
    url_or_username: "Missing required field Url Or Username"
